name: Compilar KOMPRUSSR

# Se ejecuta al subir una etiqueta v* (por ejemplo v1.0.0) y a mano desde
# Actions > Compilar KOMPRUSSR > Run workflow (sin publicar nada).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nombre: Windows }
          - { os: ubuntu-22.04, nombre: Linux }
          - { os: macos-latest, nombre: macOS }
    env:
      # "true" solo si has creado el secreto SIGNPATH_API_TOKEN (firma de Windows).
      FIRMAR: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Calcular la version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.0.1"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Instalar librerias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev libxi-dev libcurl4-openssl-dev

      - name: Configurar
        shell: bash
        run: |
          args=(-B build -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = "macOS" ]; then
            args+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15)
          elif [ "$RUNNER_OS" = "Linux" ]; then
            args+=(-DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++" -DCMAKE_MODULE_LINKER_FLAGS="-static-libgcc -static-libstdc++")
          fi
          cmake "${args[@]}"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Comprobar dependencias Linux (GLIBC <= 2.36)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          bundle = pathlib.Path('build/KOMPRUSSR_artefacts/Release/VST3/KOMPRUSSR KU-01.vst3')
          if not bundle.is_dir():
              sys.exit(f'No se encontro el bundle VST3: {bundle}')
          versions = set()
          dynamic_cpp = set()
          for file in bundle.rglob('*'):
              if not file.is_file():
                  continue
              result = subprocess.run(['objdump', '-T', str(file)], capture_output=True, text=True)
              if result.returncode != 0:
                  continue
              versions.update(re.findall(r'GLIBC_(\d+(?:\.\d+)+)', result.stdout))
              needed = subprocess.run(['objdump', '-p', str(file)], capture_output=True, text=True)
              dynamic_cpp.update(re.findall(r'NEEDED\s+(lib(?:stdc\+\+|gcc_s)\.so[^\s]*)', needed.stdout))
          def version_tuple(value): return tuple(map(int, value.split('.')))
          if not versions:
              sys.exit('objdump no encontro versiones GLIBC en los binarios VST3; no se pudo validar el requisito.')
          too_new = sorted((v for v in versions if version_tuple(v) > (2, 36)), key=version_tuple)
          if too_new:
              sys.exit('El plugin requiere una GLIBC posterior a 2.36: ' + ', '.join(too_new))
          if dynamic_cpp:
              sys.exit('No se enlazaron estaticamente estas bibliotecas de C++: ' + ', '.join(sorted(dynamic_cpp)))
          print('Comprobacion GLIBC correcta. Versiones encontradas:', ', '.join(sorted(versions, key=version_tuple)) or 'ninguna')
          print('libstdc++ y libgcc no aparecen como dependencias compartidas.')
          PY

      # ---------- Windows ----------
      - name: Crear instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DPluginVersion=$env:VERSION" "/FKOMPRUSSR-KU-01-Windows-$env:VERSION-Setup" installer/KOMPRUSSR.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crear ZIP portatil de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vst3 = Join-Path $PWD 'build\KOMPRUSSR_artefacts\Release\VST3\KOMPRUSSR KU-01.vst3'
          if (-not (Test-Path -LiteralPath $vst3 -PathType Container)) { throw "No se encontro el bundle VST3: $vst3" }
          $staging = Join-Path $env:RUNNER_TEMP 'komprussr-windows-portable'
          $bundle = Join-Path $staging 'KOMPRUSSR KU-01.vst3'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $vst3 -Destination $bundle -Recurse
          $zip = Join-Path $PWD "installer\output\KOMPRUSSR-KU-01-$env:VERSION-Windows-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Comprobar dependencias del runtime de Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Confirmar runtime estático de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem 'build\KOMPRUSSR_artefacts\Release\VST3\KOMPRUSSR KU-01.vst3' -Recurse -File | Where-Object { $_.Extension -eq '.vst3' } | Select-Object -First 1
          if (-not $plugin) { throw 'No se encontro el binario VST3 de Windows.' }
          $deps = & dumpbin /dependents $plugin.FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin fallo: $deps" }
          $deps | ForEach-Object { Write-Host $_ }
          if (($deps -join "`n") -match '(?i)\b(MSVC[PR]|VCRUNTIME|CONCRT|VCOMP)[^\s]*\.dll') {
            throw 'El plugin depende de una DLL redistribuible de Visual C++; se esperaba runtime estatico.'
          }
          Write-Host 'Runtime de Visual C++ estatico confirmado.'

      # Firma opcional con SignPath (gratis para codigo abierto). Se salta sola
      # mientras no exista el secreto SIGNPATH_API_TOKEN.
      - name: Subir instalador sin firmar
        id: sin-firmar
        if: runner.os == 'Windows' && env.FIRMAR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: installer/output/*.exe

      - name: Firmar con SignPath
        if: runner.os == 'Windows' && env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: komprussr
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/firmado

      - name: Usar el instalador firmado
        if: runner.os == 'Windows' && env.FIRMAR == 'true'
        shell: pwsh
        run: |
          $zip = Get-ChildItem installer/firmado -Filter *.zip -ErrorAction SilentlyContinue
          if ($zip) { Expand-Archive $zip[0].FullName installer/firmado -Force }
          Copy-Item installer/firmado/*.exe installer/output/ -Force

      - name: Subir instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KOMPRUSSR-Windows
          path: |
            installer/output/*.exe
            installer/output/*.zip
          if-no-files-found: error

      # ---------- macOS y Linux ----------
      - name: Empaquetar macOS o Linux
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/package-unix.sh "$RUNNER_OS" "$VERSION"

      - name: Verificar binarios y paquetes macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bundle in "build/KOMPRUSSR_artefacts/Release/VST3/KOMPRUSSR KU-01.vst3" "build/KOMPRUSSR_artefacts/Release/AU/KOMPRUSSR KU-01.component"; do
            test -d "$bundle"
            binary="$(find "$bundle" -type f -perm -111 | head -n 1)"
            test -n "$binary"
            echo "lipo -info: $binary"
            lipo -info "$binary"
            lipo -verify_arch arm64 x86_64 "$binary"
            otool -L "$binary"
          done
          ZIP="build/package/KOMPRUSSR-KU-01-macOS-$VERSION.zip"
          PKG="build/package/KOMPRUSSR-KU-01-macOS-$VERSION.pkg"
          unzip -l "$ZIP" | grep -F 'KOMPRUSSR KU-01.vst3' >/dev/null
          unzip -l "$ZIP" | grep -F 'KOMPRUSSR KU-01.component' >/dev/null
          pkgutil --payload-files "$PKG" | grep -F 'KOMPRUSSR KU-01.vst3' >/dev/null
          pkgutil --payload-files "$PKG" | grep -F 'KOMPRUSSR KU-01.component' >/dev/null
          echo 'El ZIP y el PKG contienen VST3 y AU.'

      - name: Subir paquete macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: KOMPRUSSR-macOS
          path: |
            build/package/*.pkg
            build/package/*.zip
          if-no-files-found: error

      - name: Subir paquete Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KOMPRUSSR-Linux
          path: build/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Publicar archivos de GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar instaladores y paquetes
        uses: actions/download-artifact@v4
        with:
          pattern: KOMPRUSSR-*
          path: release-assets
          merge-multiple: true

      - name: Adjuntar archivos a la version
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Requisitos mínimos
            - **Windows:** Windows 10 o Windows 11 de 64 bits.
            - **macOS:** macOS 10.15 (Catalina) o posterior; binario universal Intel y Apple Silicon.
            - **Linux:** distribución de 64 bits con glibc 2.35 o posterior y soporte VST3.

            ## Cómo instalar
            - **Windows:** usa el `.exe` para instalarlo automáticamente o el `.zip` para copiar `KOMPRUSSR KU-01.vst3` manualmente a la carpeta VST3 común. El instalador no está firmado y puede mostrar SmartScreen.
            - **macOS:** abre el `.pkg` para instalar VST3 y AU, o usa el `.zip` para instalarlos manualmente. Los paquetes no están notarizados; Gatekeeper puede mostrar un aviso o bloquear la apertura.
            - **Linux:** descomprime el `.tar.gz` y ejecuta `./instalar.sh` para instalarlo en tu usuario.

            Después, reinicia tu DAW y vuelve a buscar plugins.
